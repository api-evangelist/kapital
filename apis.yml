aid: kapital
name: Kapital
description: >-
  Kapital (KPTL MEXICO BANK, S.A., Institucion de Banca Multiple, Kapital Mexico Grupo
  Financiero) is a licensed Mexican bank and AI-native financial platform for SMEs and
  corporates, founded in 2019 and headquartered in Mexico City. Its ecosystem combines
  business and personal deposit accounts, corporate cards, SPEI and SPID transfers, FX
  cash/transfers/cheques and derivatives (forwards, interest rates), working-capital and
  revolving credit (Credito Empresarial, Credito PyME, Credito FLEX), factoring, and
  fixed-income investments (Pagare, CEDES) with Kapital IA, a native artificial-intelligence
  layer that reconciles cash flow, projects sales, validates supplier pricing and flags
  anomalous costs. It is supervised by the CNBV and Banco de Mexico, with deposits protected
  by IPAB, and it also operates in Colombia as Kapital Colombia. Kapital publishes no public
  developer portal, OpenAPI, SDK or webhook surface; the banking surface is delivered through
  its own web and mobile applications.
